          const shopSkins = SKINS.map((s,i) => ({...s,idx:i})).filter(s => s.price>0);
          shopSkins.forEach((sk, row) => {
            const y = 112 + row * 68 - shopScroll;
            if (mx>=270 && mx<=366 && my>=y+12 && my<=y+46) {
              if (!unlockedSkins.includes(sk.idx) && totalCoins>=sk.price) {
                totalCoins -= sk.price; unlockedSkins.push(sk.idx); saveData();
              }
            }
          });
        }
        else if (shopTab === 'themes') {
          THEMES.forEach((th, i) => {
            const y = 112 + i * 82 - shopScroll;
            if (mx>=270 && mx<=366 && my>=y+18 && my<=y+52) {
              if (unlockedThemes.includes(i)) {
                selectedThemeIdx = i; saveData();
              } else if (totalCoins>=th.price) {
                totalCoins -= th.price; unlockedThemes.push(i); selectedThemeIdx = i; saveData();
              }
            }
          });
        }
      }

      else if (state === 'playing') startHold();

      else if (state === 'dead') {
        // Compute button positions same as drawGameOver
        const panelH = 300;
        const panelY = Math.max(60, 300 - panelH / 2);
        let bcy = panelY + 40 + 35 + 30 + (bestScore ? 28 : 0) + 30 + 32;
        // Rejouer button
        if (mx>=canvas.width/2-80 && mx<=canvas.width/2+80 && my>=bcy && my<=bcy+44) {
          init(); countdownStart = Date.now(); state = 'countdown';
        }
        // Menu Principal button
        else if (mx>=canvas.width/2-80 && mx<=canvas.width/2+80 && my>=bcy+54 && my<=bcy+92)
          state = 'skin';
      }
    });

    canvas.addEventListener('mouseup', stopHold);
    canvas.addEventListener('mouseleave', stopHold);

    // ─── TOUCH ───────────────────────────────────────────────────────────────────
    let touchStartY = 0;
    let touchStartX = 0;
    let touchMoved  = false;

    function getTouchCoords(t) {
      const rect = canvas.getBoundingClientRect();
      return {
        mx: (t.clientX - rect.left) * (canvas.width  / rect.width),
        my: (t.clientY - rect.top)  * (canvas.height / rect.height),
      };
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      touchStartY = t.clientY;
      touchStartX = t.clientX;
      touchMoved  = false;
      // Simule mousedown pour toute la logique de clic existante
      canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY, bubbles: true }));
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const dy = touchStartY - t.clientY;
      const dx = touchStartX - t.clientX;
      if (Math.abs(dy) > 5 || Math.abs(dx) > 5) touchMoved = true;

      // Swipe scroll dans boutique et missions
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.height / rect.height;
      const scaledDy = dy * scale;

      if (state === 'shop') {
        const maxScroll = shopTab === 'skins'
          ? Math.max(0, SKINS.filter(s=>s.price>0).length * 68 - 410)
          : Math.max(0, THEMES.length * 82 - 410);
        shopScroll = Math.max(0, Math.min(maxScroll, shopScroll + scaledDy * 0.6));
      }
      touchStartY = t.clientY;
      touchStartX = t.clientX;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      stopHold();
    }, { passive: false });

    canvas.addEventListener('wheel', (e) => {
      if (state === 'shop') {
        e.preventDefault();
        const maxScroll = shopTab === 'skins'
          ? Math.max(0, SKINS.filter(s=>s.price>0).length * 68 - 410)
          : Math.max(0, THEMES.length * 82 - 410);
        shopScroll = Math.max(0, Math.min(maxScroll, shopScroll + e.deltaY * 0.5));
      }
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (state==='playing') flap(); }
    });

    // Empêche le scroll/bounce natif d'iOS sur tout le document
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchstart', (e) => {
      if (e.target !== canvas) e.preventDefault();
    }, { passive: false });

    init();
    state = 'skin';
    loop();
  </script>
</body>
</html>
